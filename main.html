<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Modelo y = 2x + 6</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs/dist/tf.min.js"></script>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .container {
        background: #1e293b;
        padding: 30px;
        border-radius: 20px;
        width: 350px;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      }

      input {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border-radius: 10px;
        border: none;
        outline: none;
      }

      button {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        border: none;
        border-radius: 10px;
        background: #3b82f6;
        color: white;
        font-weight: bold;
        cursor: pointer;
      }

      button:disabled {
        background: gray;
        cursor: not-allowed;
      }

      .progress-bar {
        width: 100%;
        height: 20px;
        background: #334155;
        border-radius: 10px;
        overflow: hidden;
        margin-top: 15px;
      }

      .progress {
        height: 100%;
        width: 0%;
        background: #22c55e;
        transition: width 0.2s;
      }

      #resultado {
        margin-top: 15px;
        font-size: 18px;
      }

      #epoca {
        margin-top: 10px;
        font-size: 14px;
        color: #cbd5f5;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>y = 2x + 6</h2>

      <input type="number" id="X" placeholder="Ingrese X" />

      <button onclick="prepararmodelos()" id="boton">Preparar modelo</button>

      <button onclick="predecir()">Predecir Y</button>

      <div class="progress-bar">
        <div class="progress" id="barra"></div>
      </div>

      <p id="epoca"></p>
      <p id="resultado"></p>
    </div>

    <script>
      let model;

      async function prepararmodelos() {
        const boton = document.getElementById("boton");
        boton.disabled = true;
        boton.innerHTML = "Entrenando...";

        model = tf.sequential();
        model.add(tf.layers.dense({ units: 1, inputShape: [1] }));

        model.compile({
          loss: "meanSquaredError",
          optimizer: "sgd",
        });

        const xs = tf.tensor2d([-6, -5, -4, -3, -2, -1, 0, 1, 2], [9, 1]);
        const ys = tf.tensor2d([-6, -4, -2, 0, 2, 4, 6, 8, 10], [9, 1]);

        const totalEpocas = 350;

        await model.fit(xs, ys, {
          epochs: totalEpocas,
          callbacks: {
            onEpochEnd: async (epoch, logs) => {
              const progreso = ((epoch + 1) / totalEpocas) * 100;

              document.getElementById("barra").style.width = progreso + "%";

              document.getElementById("epoca").innerHTML =
                `Época ${epoch + 1} / ${totalEpocas} - Loss: ${logs.loss.toFixed(4)}`;
            },
          },
        });

        boton.innerHTML = "Modelo listo ✔";
        boton.disabled = false;

        document.getElementById("epoca").innerHTML =
          "Entrenamiento finalizado ✔";
      }

      function predecir() {
        const X = document.getElementById("X").value;

        if (!model) {
          alert("Primero entrene el modelo");
          return;
        }

        const resultado = model.predict(tf.tensor2d([Number(X)], [1, 1]));
        const valor = resultado.dataSync()[0];

        document.getElementById("resultado").innerHTML =
          "Resultado: " + valor.toFixed(2);
      }
    </script>
  </body>
</html>
